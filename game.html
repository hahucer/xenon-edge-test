<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Edge Desk · Game</title><style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0b1020}body{padding:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}

/* Game occupies the left M slot; iCUE provides its companion widgets. */
.game-view{min-height:360px;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:minmax(0,1fr);gap:12px}
.game-widget{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;padding:clamp(20px,2.6vw,30px);overflow:hidden;border:1px solid #514971;border-radius:17px;background:radial-gradient(ellipse at 18% 0%,#7960b12b,transparent 62%),linear-gradient(145deg,#17172e,#0b1020);box-shadow:0 16px 52px #0004,inset 0 1px #e9dfff12;color:#f2eeff;container-type:inline-size}
.game-widget-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex:0 0 auto;margin-bottom:22px}.game-kicker{font:800 10px/1.2 system-ui,sans-serif;letter-spacing:.2em;color:#c6acff}.game-widget h2{margin:7px 0 0;font:850 clamp(24px,3.3vw,34px)/1.1 system-ui,sans-serif;letter-spacing:-.03em}.game-grid-mark{width:26px;height:26px;color:#aa97d3;opacity:.65}
.game-launch-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:16px}
.game-tile{position:relative;min-width:0;min-height:150px;display:flex;flex-direction:column;overflow:hidden;border:1px solid #484460;border-radius:15px;background:linear-gradient(145deg,#1d1e34,#111629);color:#f3f1ff;text-decoration:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;box-shadow:inset 0 1px #ffffff09;transition:transform .16s,border-color .16s,box-shadow .16s}
.game-tile:hover{border-color:#ad91e9;transform:translateY(-2px);box-shadow:0 9px 24px #0004,0 0 22px #ad91e917}.game-tile:active{transform:scale(.975)}.game-tile:focus-visible{outline:3px solid #d4b7ff;outline-offset:3px}.game-tile-art{position:relative;flex:1;min-height:72px;display:grid;place-items:center;overflow:hidden;background:#131b2a}.game-tile-art:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 65%,#14172b88);pointer-events:none}.game-tile-art img{display:block;width:100%;height:100%;position:absolute;inset:0;object-fit:cover;transition:transform .3s}.game-tile:hover .game-tile-art img{transform:scale(1.025)}
.game-tile-lol .game-tile-art{background:radial-gradient(ellipse at 50% 45%,#384547,#102329 70%)}.game-tile-steam .game-tile-art{background:#0e1928}.game-tile-lol .game-tile-art img,.game-tile-steam .game-tile-art img{position:static;width:auto;height:100%;max-height:190px;max-width:80%;object-fit:contain}.game-tile-steam .game-tile-art img{mix-blend-mode:screen;max-width:73%}
.game-tile-copy{position:relative;flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;gap:5px;min-height:72px;padding:14px 46px 14px 17px;border-top:1px solid #a49bb71a;background:linear-gradient(115deg,#242439bb,#12182be8)}.game-tile-name{font-size:clamp(13px,2.45cqw,19px);font-weight:800;letter-spacing:-.025em;line-height:1.2}.game-tile-meta{font-size:10px;font-weight:650;color:#9d9fb9;line-height:1.2;letter-spacing:.03em}.game-launch-arrow{position:absolute;right:14px;bottom:23px;display:grid;place-items:center;width:26px;height:26px;border-radius:8px;color:#cab6ed;background:#d8c5ff0b}.game-launch-arrow svg{width:20px;height:20px}
.game-image-fallback{display:none;padding:16px;text-align:center;font-size:17px;font-weight:850;letter-spacing:.05em;color:#dfc9ff}.game-tile-art.image-missing img{display:none}.game-tile-art.image-missing .game-image-fallback{display:block}
.game-message{position:absolute;left:20px;right:20px;bottom:20px;z-index:2;padding:12px 16px;border:1px solid #a894d2;border-radius:12px;background:#161c30f5;box-shadow:0 8px 24px #0008;color:#eee3ff;text-align:center;font-size:12px;font-weight:700;opacity:0;transform:translateY(8px);pointer-events:none;transition:.18s}.game-message.visible{opacity:1;transform:none}
@media(max-width:1000px){.game-view{grid-template-columns:minmax(0,1fr);min-height:560px}}
@container(max-width:480px){.game-launch-grid{gap:10px}.game-tile-copy{padding-left:12px;padding-right:36px;min-height:64px}.game-tile-name{font-size:13px}.game-launch-arrow{right:9px;bottom:20px;width:22px;height:22px}.game-tile-meta{font-size:9px}}
@media(prefers-reduced-motion:reduce){.game-tile,.game-tile-art img,.game-message{transition:none}}

body>.game-widget{width:100%;height:100vh;height:100dvh;padding:clamp(18px,3.8vw,32px);box-shadow:inset 0 1px #e9dfff12}.game-widget h2{font-size:clamp(24px,4vw,34px)}
@media(max-height:480px){.game-widget-head{margin-bottom:12px}.game-launch-grid{gap:10px}.game-tile{min-height:0}.game-tile-copy{min-height:52px;padding-top:9px;padding-bottom:9px}.game-launch-arrow{bottom:13px}.game-tile-lol .game-tile-art img,.game-tile-steam .game-tile-art img{max-height:120px}}
</style></head><body><section class="game-widget" aria-label="Game M 위젯"><div class="game-widget-head"><div><div class="game-kicker">✦ QUICK LAUNCH</div><h2>Game</h2></div><svg class="game-grid-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></div><div class="game-launch-grid"><a class="game-tile game-tile-palworld" href="steam://run/1623730" data-game-name="팰월드" aria-label="팰월드 실행" title="팰월드 실행 요청"><span class="game-tile-art"><img src="game-palworld.jpg" alt="" draggable="false"><span class="game-image-fallback" aria-hidden="true">PALWORLD</span></span><span class="game-tile-copy"><span class="game-tile-name">팰월드</span><span class="game-tile-meta">Steam</span></span><span class="game-launch-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 16 8-8M8 8h8v8"/></svg></span></a><a class="game-tile game-tile-lol" href="riotclient://product/launch/v1/league_of_legends/live" data-game-name="리그 오브 레전드" aria-label="리그 오브 레전드 실행" title="리그 오브 레전드 실행 요청 · 연결 확인 전"><span class="game-tile-art"><img src="game-lol.svg" alt="" draggable="false"><span class="game-image-fallback" aria-hidden="true">LEAGUE OF LEGENDS</span></span><span class="game-tile-copy"><span class="game-tile-name">리그 오브 레전드</span><span class="game-tile-meta">Riot Client</span></span><span class="game-launch-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 16 8-8M8 8h8v8"/></svg></span></a><a class="game-tile game-tile-pubg" href="steam://run/578080" data-game-name="배틀그라운드" aria-label="배틀그라운드 실행" title="배틀그라운드 실행 요청"><span class="game-tile-art"><img src="game-pubg.jpg" alt="" draggable="false"><span class="game-image-fallback" aria-hidden="true">PUBG: BATTLEGROUNDS</span></span><span class="game-tile-copy"><span class="game-tile-name">배틀그라운드</span><span class="game-tile-meta">Steam</span></span><span class="game-launch-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 16 8-8M8 8h8v8"/></svg></span></a><a class="game-tile game-tile-steam" href="steam://open/games" data-game-name="Steam" aria-label="Steam 실행" title="Steam 실행 요청"><span class="game-tile-art"><img src="game-steam.jpg" alt="" draggable="false"><span class="game-image-fallback" aria-hidden="true">LIBRARY</span></span><span class="game-tile-copy"><span class="game-tile-name">Steam</span><span class="game-tile-meta">Steam</span></span><span class="game-launch-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 16 8-8M8 8h8v8"/></svg></span></a></div><div class="game-message" role="status" aria-live="polite"></div></section><script>
// Protocol links request the installed launcher; the browser cannot confirm launch success.
document.querySelectorAll('.game-widget').forEach(widget=>{
  let noticeTimer;
  widget.querySelectorAll('.game-tile').forEach(link=>link.addEventListener('click',()=>{
    const notice=widget.querySelector('.game-message');
    notice.textContent=link.dataset.gameName+' 실행 요청';
    notice.classList.add('visible');
    clearTimeout(noticeTimer);
    noticeTimer=setTimeout(()=>notice.classList.remove('visible'),3500);
  }));
  widget.querySelectorAll('.game-tile-art img').forEach(img=>{
    const fallback=()=>img.parentElement.classList.add('image-missing');
    img.addEventListener('error',fallback);
    if(img.complete&&!img.naturalWidth)fallback();
  });
});
</script></body></html>
