<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Edge Desk · Game</title><style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0b1020}body{padding:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}

/* Game occupies one left-hand M slot; companion widgets are placed in iCUE. */
.game-view{min-height:360px;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:minmax(0,1fr);gap:12px}
.game-widget{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;padding:clamp(20px,2.6vw,30px);overflow:hidden;border:1px solid #514971;border-radius:17px;background:radial-gradient(ellipse at 18% 0%,#7960b12b,transparent 62%),linear-gradient(145deg,#17172e,#0b1020);box-shadow:0 16px 52px #0004,inset 0 1px #e9dfff12;color:#f2eeff}
.game-widget-head{position:relative;z-index:1;flex:0 0 auto}.game-kicker{font:800 10px/1.2 system-ui,sans-serif;letter-spacing:.2em;color:#c6acff}.game-widget h2{margin:7px 0 0;font:850 clamp(24px,3.3vw,34px)/1.1 system-ui,sans-serif;letter-spacing:-.03em}
.game-canvas{position:relative;flex:1;min-height:180px;display:grid;place-items:center;isolation:isolate}.game-glow{position:absolute;width:74%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#9a77ed20,transparent 66%);z-index:-1}.game-orbit{position:absolute;width:72%;aspect-ratio:1;border:1px solid #b6a0ef13;border-radius:50%;z-index:-1}.game-orbit-two{width:91%;border-style:dashed;border-color:#b6a0ef0a}.game-controller{display:block;width:min(61%,300px);height:auto;filter:drop-shadow(0 0 25px #af86ff20)}
@media(max-width:1000px){.game-view{grid-template-columns:minmax(0,1fr)}}

body>.game-widget{width:100%;height:100vh;height:100dvh;padding:clamp(18px,3.8vw,32px);box-shadow:inset 0 1px #e9dfff12}.game-widget h2{font-size:clamp(24px,4vw,34px)}.game-controller{width:min(61%,310px)}@media(max-height:360px){.game-widget{padding:16px}.game-canvas{min-height:0}.game-controller{width:min(35%,180px)}}
</style></head><body><section class="game-widget" aria-label="Game M 위젯"><div class="game-widget-head"><div class="game-kicker">✦ GAME</div><h2>Game</h2></div><div class="game-canvas"><div class="game-orbit game-orbit-one"></div><div class="game-orbit game-orbit-two"></div><div class="game-glow"></div><svg class="game-controller" viewBox="0 0 240 160" fill="none" aria-hidden="true"><defs><linearGradient id="game-line" x1="32" y1="35" x2="210" y2="150" gradientUnits="userSpaceOnUse"><stop stop-color="#dbccff"/><stop offset="1" stop-color="#9174ee"/></linearGradient><linearGradient id="game-surface" x1="120" y1="38" x2="120" y2="145" gradientUnits="userSpaceOnUse"><stop stop-color="#b39bff" stop-opacity=".16"/><stop offset="1" stop-color="#b39bff" stop-opacity=".025"/></linearGradient></defs><path d="M77 46h86c18 0 32 13 38 34l15 45c6 22-13 32-26 16l-24-29H74l-24 29c-13 16-32 6-26-16l15-45c6-21 20-34 38-34Z" fill="url(#game-surface)" stroke="url(#game-line)" stroke-width="3.5"/><path d="M63 68v36M45 86h36" stroke="#d9cbff" stroke-width="5" stroke-linecap="round"/><circle cx="170" cy="73" r="5" fill="#ccb4ff"/><circle cx="186" cy="89" r="5" fill="#998be5"/><circle cx="154" cy="89" r="5" fill="#998be5"/><circle cx="170" cy="105" r="5" fill="#ccb4ff"/><path d="M110 80h5M126 80h5" stroke="#8d86b4" stroke-width="3" stroke-linecap="round"/><path d="M89 46l5-9h52l5 9" stroke="#9180bc" stroke-width="3"/></svg></div></section></body></html>
