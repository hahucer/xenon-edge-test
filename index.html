<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b17">
<title>Edge Desk · Personal Control Bar</title>
<style>
*{box-sizing:border-box} :root{color-scheme:dark;--ink:#f4f6ff;--muted:#9ba8c6;--line:#303d65;--green:#b5ff83;--blue:#9aaeff}
body{margin:0;min-width:320px;min-height:100vh;min-height:100dvh;color:var(--ink);background:radial-gradient(ellipse at 50% 45%,#10224a 0,#080b17 58%,#05060c 100%);font:15px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit}button{color:inherit;cursor:pointer}.app{width:100%;min-height:100vh;min-height:100dvh;padding:14px 18px 18px;display:grid;grid-template-rows:48px 42px minmax(0,1fr);gap:10px}.topbar{min-width:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px}.brand{display:flex;align-items:center;gap:10px}.brand-mark{width:32px;height:32px;display:grid;place-items:center;border:1px solid #c2ff95;border-radius:10px;color:#c2ff95;background:#b5ff8316;font-size:19px}.brand-name{font-size:15px;font-weight:850;letter-spacing:.12em}.brand-sub{margin-top:2px;color:#8994b4;font-size:8px;font-weight:700;letter-spacing:.18em}.top-status{justify-self:center;display:flex;align-items:center;gap:10px;padding:8px 13px;border:1px solid #313b61;border-radius:99px;background:#11172b;color:#c4cce0;font-size:12px;font-weight:750;white-space:nowrap}.status-dot{width:7px;height:7px;border-radius:50%;background:#aaff77;box-shadow:0 0 12px #aaff77}.top-weather{color:#c4cce0}.top-actions{justify-self:end;display:flex;gap:8px}.icon-btn{width:34px;height:34px;display:grid;place-items:center;border:1px solid #6375bb;border-radius:10px;background:#111a34;font-size:15px}.page-tabs{display:flex;align-items:center;justify-content:center;gap:8px}.page-tab,.page-add{min-width:38px;height:34px;padding:0 13px;border:1px solid #303d65;border-radius:11px;background:#11172b;color:#aeb9d5;font-size:11px;font-weight:800;letter-spacing:.08em}.page-tab.active{border-color:#b5ff83;background:#b5ff8318;color:#d5ffc0;box-shadow:0 0 16px #b5ff8318}.page-add{min-width:34px;padding:0;color:#b5ff83;font-size:18px}.page-view{display:none}.page-view.active{display:grid}.columns{min-height:0;grid-template-columns:1fr .92fr 1fr;gap:12px}.page-placeholder{min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:1px dashed #46547d;border-radius:17px;background:#0c1124aa;color:#9ba8c6}.page-placeholder strong{color:#f4f6ff;font-size:20px}.page-placeholder span{font-size:12px}.panel{min-width:0;min-height:0;display:flex;flex-direction:column;padding:clamp(14px,1.4vw,22px);border:1px solid #35416a;border-radius:17px;background:linear-gradient(145deg,#111831ed,#0b1022f2);box-shadow:0 16px 52px #0005,inset 0 1px #ffffff0a;overflow:hidden}.tasks-panel{background:radial-gradient(ellipse at 15% 0%,#29345f55,transparent 55%),linear-gradient(145deg,#11162f,#0b1021)}.timer-panel{background:radial-gradient(ellipse at 50% 0%,#214b4166,transparent 58%),linear-gradient(145deg,#111831,#0b1022)}.events-panel{background:radial-gradient(ellipse at 85% 0%,#263d6255,transparent 55%),linear-gradient(145deg,#11162f,#0a1020)}.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}.kicker{color:var(--green);font-size:9px;font-weight:850;letter-spacing:.18em}.panel-title{margin:4px 0 0;font-size:clamp(17px,1.45vw,23px);line-height:1.1;letter-spacing:-.025em}.subtle{color:#8290af;font-size:10px}.task-form,.event-form{display:flex;gap:7px;margin-bottom:12px}.field{min-width:0;width:100%;padding:9px 10px;border:1px solid #344064;border-radius:9px;background:#0b1227;color:white;font-size:12px}.field::placeholder{color:#7582a1}.add-btn,.control-btn,.preset{border:1px solid #39466e;border-radius:9px;background:#111831;color:#dfffd0;padding:8px 11px;font-size:11px;font-weight:750;white-space:nowrap}.add-btn{min-width:38px;color:var(--green);font-size:17px;padding:5px}.task-list,.event-list{min-height:0;flex:1;overflow:auto;display:flex;flex-direction:column;gap:7px;padding-right:3px}.task-row{display:flex;align-items:center;gap:9px;min-height:40px;padding:8px 10px;border:1px solid #2c385d;border-radius:10px;background:linear-gradient(100deg,#171f3d,#11182d)}.task-row input[type=checkbox]{width:15px;height:15px;flex:0 0 auto;margin:0;accent-color:#b5ff83}.task-text{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#e8edff;font-size:12px}.task-row.done .task-text{text-decoration:line-through;color:#8792ad}.remove-btn{border:0;background:transparent;color:#8390ad;font-size:16px;padding:0 2px}.remove-btn:hover{color:#ff9aaf}.empty{margin:auto;color:#7784a2;font-size:11px;text-align:center;padding:20px}.timer-content{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.timer-caption{color:#9caaca;font-size:10px;font-weight:750;letter-spacing:.15em}.timer-display{margin:13px 0 16px;font-size:clamp(48px,6vw,82px);font-weight:820;line-height:1;letter-spacing:-.055em;font-variant-numeric:tabular-nums;text-shadow:0 0 28px #9fc5ff22}.timer-track{width:min(100%,300px);height:5px;overflow:hidden;border-radius:9px;background:#283353;margin-bottom:18px}.timer-progress{height:100%;width:100%;border-radius:inherit;background:linear-gradient(90deg,#b5ff83,#7be4b0);transition:width .4s linear}.timer-controls{display:flex;justify-content:center;flex-wrap:wrap;gap:7px}.control-btn.primary{border-color:#a7ee8c;background:linear-gradient(135deg,#a9fb8c44,#4aa87d3d);color:#eaffdc}.presets{display:flex;gap:7px;margin-top:11px}.preset{color:#c7d2ef;padding:7px 10px}.event-form{display:grid;grid-template-columns:minmax(0,1fr) minmax(110px,.8fr) 38px}.event-form .field{font-size:11px;padding:8px 9px}.event-list{gap:8px}.event-card{display:grid;grid-template-columns:54px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:58px;padding:8px 10px;border:1px solid #303d64;border-radius:11px;background:linear-gradient(105deg,#17203d,#10172d);box-shadow:inset 0 1px #ffffff08}.event-date{height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #3b496e;border-radius:9px;background:#0b1227;color:#b8c7ef;font-size:9px;font-weight:750;line-height:1.15}.event-date strong{color:#f1f4ff;font-size:16px}.event-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:750;color:#e9eeff}.event-full-date{margin-top:3px;color:#8693b1;font-size:9px}.dday-badge{min-width:54px;padding:7px 8px;border:1px solid #78bd78;border-radius:8px;background:#a8fa7f1a;color:#caffae;text-align:center;font-size:10px;font-weight:850;white-space:nowrap}.event-card.past .dday-badge{border-color:#58627e;background:#8792ad12;color:#a6afc4}.top-clock{font-variant-numeric:tabular-nums}.top-weather{color:#d5def2}.weather-icon{margin-right:3px}.toast{position:fixed;left:50%;bottom:20px;z-index:5;transform:translate(-50%,14px);opacity:0;pointer-events:none;padding:9px 14px;border:1px solid #9ff280;border-radius:99px;background:#13221c;color:#eaffdc;font-size:11px;font-weight:800;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-aspect-ratio:2/1){body{overflow:auto}.app{height:auto;min-height:100dvh;grid-template-rows:auto auto auto;padding:11px}.topbar{grid-template-columns:1fr auto}.top-status{grid-column:1/-1;grid-row:2;justify-self:start}.top-actions{grid-column:2;grid-row:1}.columns{grid-template-columns:1fr;grid-template-rows:minmax(260px,auto) minmax(300px,auto) minmax(300px,auto)}.page-view.active{display:grid}.page-placeholder{min-height:70vh}.panel{padding:16px}.timer-display{font-size:58px}}
</style>
</head>
<body><div class="app">
<header class="topbar"><div class="brand"><div class="brand-mark">✦</div><div><div class="brand-name">EDGE DESK</div><div class="brand-sub">PERSONAL CONTROL BAR</div></div></div><div class="top-status"><span class="status-dot"></span><span class="top-clock" id="clock">--:-- p.m.</span><span>·</span><span><span class="weather-icon" id="weather-icon">☁️</span><span id="temperature">--</span>°C <span id="condition">날씨 연결 중</span></span><span class="subtle" id="date"></span></div><div class="top-actions"><button class="icon-btn" id="refresh-weather" aria-label="날씨 새로고침">↻</button></div></header>
<nav class="page-tabs" id="page-tabs" aria-label="페이지 메뉴"><button class="page-tab active" data-page="0">Today</button><button class="page-tab" data-page="1">Work</button><button class="page-tab" data-page="2">Game</button><button class="page-add" id="page-add" aria-label="페이지 추가">＋</button></nav>
<main class="columns page-view active" data-view="0">
<section class="panel tasks-panel" aria-label="오늘의 할 일"><div class="panel-head"><div><div class="kicker">✧ TODAY · PLAN</div><h2 class="panel-title">오늘의 할 일</h2></div><span class="subtle" id="task-count">0개</span></div><form class="task-form" id="task-form"><input class="field" id="task-input" placeholder="할 일을 입력하세요" autocomplete="off"><button class="add-btn" aria-label="할 일 추가">＋</button></form><div class="task-list" id="task-list"></div></section>
<section class="panel timer-panel" aria-label="집중 타이머"><div class="panel-head"><div><div class="kicker">◷ FOCUS SESSION</div><h2 class="panel-title">집중 타이머</h2></div><span class="subtle">집중하고, 잠깐 쉬어가요</span></div><div class="timer-content"><div class="timer-caption" id="timer-caption">FOCUS TIME</div><div class="timer-display" id="timer-display">25:00</div><div class="timer-track"><div class="timer-progress" id="timer-progress"></div></div><div class="timer-controls"><button class="control-btn primary" id="timer-start">시작</button><button class="control-btn" id="timer-reset">초기화</button></div><div class="presets"><button class="preset" data-min="25">25분 집중</button><button class="preset" data-min="5">5분 휴식</button></div></div></section>
<section class="panel events-panel" aria-label="일정 D-DAY"><div class="panel-head"><div><div class="kicker">▦ UPCOMING · D-DAY</div><h2 class="panel-title">일정 D-DAY</h2></div><span class="subtle">다가오는 일정</span></div><form class="event-form" id="event-form"><input class="field" id="event-name" placeholder="일정 이름" autocomplete="off"><input class="field" id="event-date" type="date" aria-label="일정 날짜"><button class="add-btn" aria-label="일정 추가">＋</button></form><div class="event-list" id="event-list"></div></section>
</main><section class="page-placeholder page-view" data-view="1"><strong>Work</strong><span>위젯은 나중에 함께 정해요</span></section><section class="page-placeholder page-view" data-view="2"><strong>Game</strong><span>이 페이지에 넣을 위젯은 나중에 정해요</span></section></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const TZ="America/Edmonton",WEATHER_URL="https://api.open-meteo.com/v1/forecast?latitude=53.5461&longitude=-113.4938&current=temperature_2m,weather_code&temperature_unit=celsius&timezone=America%2FEdmonton&forecast_days=1";
function readList(key){try{const value=JSON.parse(localStorage.getItem(key)||"[]");return Array.isArray(value)?value:[]}catch{return []}}function saveList(key,value){localStorage.setItem(key,JSON.stringify(value))}
function showToast(message){const t=document.getElementById("toast");t.textContent=message;t.classList.add("show");clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.classList.remove("show"),1500)}
function updateClock(){const now=new Date();document.getElementById("clock").textContent=new Intl.DateTimeFormat("en-CA",{timeZone:TZ,hour:"2-digit",minute:"2-digit",hour12:true}).format(now);document.getElementById("date").textContent=new Intl.DateTimeFormat("en-CA",{timeZone:TZ,month:"short",day:"numeric"}).format(now)}
function weatherText(code){if(code===0)return["맑음","☀️"];if(code<=3)return["구름 조금","🌤️"];if(code===45||code===48)return["안개","🌫️"];if(code<60)return["이슬비","🌦️"];if(code<70)return["비","🌧️"];if(code<80)return["눈","❄️"];if(code<90)return["소나기","🌦️"];return["뇌우","⛈️"]}
async function loadWeather(){try{const response=await fetch(WEATHER_URL,{cache:"no-store"});if(!response.ok)throw Error();const data=await response.json(),summary=weatherText(data.current.weather_code);document.getElementById("temperature").textContent=Math.round(data.current.temperature_2m);document.getElementById("condition").textContent=summary[0];document.getElementById("weather-icon").textContent=summary[1]}catch{document.getElementById("condition").textContent="날씨 연결 대기"}}
document.getElementById("refresh-weather").addEventListener("click",loadWeather);
let pageCount=3;document.getElementById("page-tabs").addEventListener("click",event=>{const button=event.target.closest(".page-tab");if(!button)return;document.querySelectorAll(".page-tab").forEach(tab=>tab.classList.toggle("active",tab===button));document.querySelectorAll(".page-view").forEach(view=>view.classList.toggle("active",Number(view.dataset.view)===Number(button.dataset.page)))});document.getElementById("page-add").addEventListener("click",()=>{const index=pageCount++,label="페이지 "+(index+1),tab=document.createElement("button"),view=document.createElement("section");tab.className="page-tab";tab.dataset.page=index;tab.textContent=label;document.getElementById("page-add").before(tab);view.className="page-placeholder page-view";view.dataset.view=index;const title=document.createElement("strong"),hint=document.createElement("span");title.textContent=label;hint.textContent="이 페이지에 넣을 위젯은 나중에 정해요";view.append(title,hint);document.querySelector(".app").insertBefore(view,document.querySelector(".columns").nextSibling);tab.click()});
function renderTasks(){const box=document.getElementById("task-list");box.replaceChildren();const all=readList("edge-tasks");document.getElementById("task-count").textContent=all.filter(x=>!x.done).length+"개 남음";if(!all.length){const empty=document.createElement("div");empty.className="empty";empty.textContent="할 일을 추가해 보세요";box.append(empty);return}all.forEach((task,index)=>{const row=document.createElement("div");row.className="task-row"+(task.done?" done":"");const check=document.createElement("input");check.type="checkbox";check.checked=!!task.done;check.setAttribute("aria-label",task.text+" 완료");check.onchange=()=>{const list=readList("edge-tasks");list[index].done=check.checked;saveList("edge-tasks",list);renderTasks()};const text=document.createElement("span");text.className="task-text";text.textContent=task.text;const remove=document.createElement("button");remove.className="remove-btn";remove.type="button";remove.textContent="×";remove.setAttribute("aria-label",task.text+" 삭제");remove.onclick=()=>{const list=readList("edge-tasks");list.splice(index,1);saveList("edge-tasks",list);renderTasks()};row.append(check,text,remove);box.append(row)})}
document.getElementById("task-form").addEventListener("submit",event=>{event.preventDefault();const input=document.getElementById("task-input"),text=input.value.trim();if(!text)return;const list=readList("edge-tasks");list.push({text,done:false});saveList("edge-tasks",list);input.value="";renderTasks()});
let seconds=1500,totalSeconds=1500,interval=null;function paintTimer(){const m=Math.floor(seconds/60),s=seconds%60;document.getElementById("timer-display").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");document.getElementById("timer-progress").style.width=(totalSeconds?seconds/totalSeconds*100:0)+"%"}function stopTimer(){clearInterval(interval);interval=null;document.getElementById("timer-start").textContent="시작"}document.getElementById("timer-start").onclick=()=>{if(interval){stopTimer();return}document.getElementById("timer-start").textContent="일시정지";interval=setInterval(()=>{seconds=Math.max(0,seconds-1);paintTimer();if(seconds===0){stopTimer();showToast("집중 시간이 끝났어요")}},1000)};document.getElementById("timer-reset").onclick=()=>{stopTimer();seconds=totalSeconds=1500;document.getElementById("timer-caption").textContent="FOCUS TIME";paintTimer()};document.querySelectorAll(".preset").forEach(button=>button.onclick=()=>{stopTimer();totalSeconds=seconds=Number(button.dataset.min)*60;document.getElementById("timer-caption").textContent=button.dataset.min==="5"?"SHORT BREAK":"FOCUS TIME";paintTimer()});
function renderEvents(){const box=document.getElementById("event-list");box.replaceChildren();const list=readList("edge-events").sort((a,b)=>a.date.localeCompare(b.date));if(!list.length){const empty=document.createElement("div");empty.className="empty";empty.textContent="기념일이나 중요한 일정을 추가해 보세요";box.append(empty);return}const today=new Intl.DateTimeFormat("en-CA",{timeZone:TZ}).format(new Date()),todayUTC=Date.parse(today+"T00:00:00Z");list.forEach((item,index)=>{const diff=Math.round((Date.parse(item.date+"T00:00:00Z")-todayUTC)/86400000),date=new Date(item.date+"T00:00:00Z"),month=new Intl.DateTimeFormat("ko-KR",{timeZone:"UTC",month:"short"}).format(date),day=new Intl.DateTimeFormat("en-CA",{timeZone:"UTC",day:"2-digit"}).format(date),row=document.createElement("div");row.className="event-card"+(diff<0?" past":"");const dateTag=document.createElement("div");dateTag.className="event-date";const dayNumber=document.createElement("strong");dayNumber.textContent=day;const monthLabel=document.createElement("span");monthLabel.textContent=month;dateTag.append(dayNumber,monthLabel);const info=document.createElement("div");const name=document.createElement("div");name.className="event-name";name.textContent=item.name;const fullDate=document.createElement("div");fullDate.className="event-full-date";fullDate.textContent=item.date;info.append(name,fullDate);const badge=document.createElement("span");badge.className="dday-badge";badge.textContent=diff===0?"D-DAY":diff>0?"D-"+diff:"D+"+Math.abs(diff);const remove=document.createElement("button");remove.className="remove-btn";remove.type="button";remove.textContent="×";remove.setAttribute("aria-label",item.name+" 삭제");remove.onclick=()=>{const items=readList("edge-events");items.splice(index,1);saveList("edge-events",items);renderEvents()};row.append(dateTag,info,badge,remove);box.append(row)})}
document.getElementById("event-form").addEventListener("submit",event=>{event.preventDefault();const name=document.getElementById("event-name"),date=document.getElementById("event-date");if(!name.value.trim()||!date.value)return;const list=readList("edge-events");list.push({name:name.value.trim(),date:date.value});saveList("edge-events",list);name.value="";date.value="";renderEvents()});
updateClock();setInterval(updateClock,30000);loadWeather();setInterval(loadWeather,900000);renderTasks();renderEvents();paintTimer();
</script></body></html>
