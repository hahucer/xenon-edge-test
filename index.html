<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b14">
  <title>Xenon Edge Test</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 0%, #14234a 0, #080b14 58%); color: #f4f7ff; font: 16px/1.4 system-ui, sans-serif; }
    main { width: min(92vw, 560px); padding: 34px; border: 1px solid #31456d; border-radius: 24px; background: #111827dd; box-shadow: 0 20px 80px #0008; text-align: center; }
    .label { color: #7dd3fc; font-size: 12px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 12px 0 8px; font-size: clamp(28px, 7vw, 46px); }
    p { margin: 0; color: #aab6cc; }
    #clock { margin-top: 28px; font-size: clamp(40px, 12vw, 72px); font-variant-numeric: tabular-nums; letter-spacing: .03em; }
    #date { margin-top: 4px; color: #aab6cc; }
    .dot { display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 12px #4ade80; vertical-align: 2px; }
  </style>
</head>
<body>
  <main>
    <div class="label"><span class="dot"></span>HTML widget online</div>
    <h1>Xenon Edge Test</h1>
    <p>Your first custom screen is running.</p>
    <div id="clock" aria-live="off">--:--:--</div>
    <div id="date"></div>
  </main>
  <script>
    const clock = document.getElementById("clock");
    const date = document.getElementById("date");
    function updateClock() {
      const now = new Date();
      clock.textContent = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      date.textContent = now.toLocaleDateString([], { weekday: "long", year: "numeric", month: "long", day: "numeric" });
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
